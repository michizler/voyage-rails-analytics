version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - backend
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0

  engine:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8502:8502"
    volumes:
      - .:/app
    command: uvicorn engine:app --host 0.0.0.0 --port 8502
    restart: always